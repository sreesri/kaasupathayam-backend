name: CI

on:
  push:
    branches: [main]
  pull_request:

# Render deploys main only after these checks pass (autoDeployTrigger: checksPass in render.yaml).
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kaasu
          POSTGRES_PASSWORD: kaasu
          POSTGRES_DB: kaasupathayam
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KAASU_DATABASE_URL: postgresql://kaasu:kaasu@localhost:5432/kaasupathayam
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Migrations apply on Postgres
        run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check
      - name: Tests (Postgres)
        run: uv run pytest
        env:
          KAASU_TEST_DATABASE_URL: postgresql://kaasu:kaasu@localhost:5432/kaasupathayam
